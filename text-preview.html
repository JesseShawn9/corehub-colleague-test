<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文本附件预览</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #252b2a; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; }
      .toolbar { position: sticky; top: 0; display: flex; gap: 14px; align-items: center; min-height: 52px; padding: 10px 16px; border-bottom: 1px solid #e6eae8; background: #fff; }
      .filename { min-width: 0; overflow: hidden; color: #252b2a; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; gap: 10px; align-items: center; margin-left: auto; white-space: nowrap; }
      select, a { color: #17815b; font: inherit; background: transparent; border: 1px solid #b8cec4; border-radius: 2px; }
      select { padding: 4px 6px; }
      a { padding: 5px 8px; text-decoration: none; }
      a:hover, a:focus-visible { border-color: #17815b; outline: none; }
      pre { min-height: calc(100vh - 52px); margin: 0; padding: 18px 20px; overflow: auto; color: #252b2a; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; white-space: pre-wrap; word-break: break-word; }
      pre.is-error { color: #bb3e3e; }
      #media { border: 0; }
      #media.media-image { display: block; width: 100%; height: calc(100vh - 60px); object-fit: contain; }
      #media.media-audio { display: block; width: min(720px, calc(100% - 40px)); margin: 32px auto; }
      #media.media-video { display: block; width: min(100%, 1120px); max-height: calc(100vh - 78px); margin: 12px auto; background: #101418; }
      [hidden] { display: none !important; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; }
        body, .toolbar { background: #101418; }
        pre, .filename { color: #f1f5f9; }
        .toolbar { border-color: #46515f; }
      }
      @media (max-width: 580px) { .toolbar { align-items: flex-start; flex-wrap: wrap; } .actions { width: 100%; margin-left: 0; } }
    </style>
    <script type="module" crossorigin src="/corehub-colleague-test/assets/textPreview-CS1Ld7Ss.js"></script>
    <link rel="modulepreload" crossorigin href="/corehub-colleague-test/assets/markdownFileResources-HWPGUM1x.js">
  </head>
  <body>
    <header class="toolbar">
      <span id="filename" class="filename"></span>
      <div class="actions">
        <label>编码 <select id="encoding" aria-label="编码"></select></label>
        <a id="download" href="">下载</a>
      </div>
    </header>
    <pre id="content" aria-live="polite">正在读取文件…</pre>
    <progress id="progress" aria-label="文件读取进度" hidden></progress>
  </body>
</html>
